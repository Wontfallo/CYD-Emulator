[platformio]
default_envs = e32r28t_ili9341

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM11
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -DBOARD_HAS_PSRAM=0
    -DCORE_DEBUG_LEVEL=0

[env:e32r28t_ili9341]
build_flags =
    ${env.build_flags}
    -DHYDRO_PANEL_ILI9341=1

[env:e32r28t_st7789]
build_flags =
    ${env.build_flags}
    -DHYDRO_PANEL_ST7789=1

